<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0d0a0a" />

  <meta name="google-site-verification" content="sy9rErVqJBLSnpTsDrgMpkeWh8xJYxOotQ8Oq2eZM7s" />

  <!-- Default SEO — each page overrides these via <SEO /> (react-helmet-async) -->
  <title>OQIRA — Online Shopping in Pakistan | Cosmetics, Jewellery &amp; Baby Clothes</title>
  <meta name="description"
    content="Pakistan's premium online store for cosmetics, skin care, jewellery, apparel and baby essentials — cash on delivery nationwide." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://okira.vercel.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OQIRA" />
  <meta property="og:locale" content="en_PK" />
  <meta property="og:url" content="https://okira.vercel.app/" />
  <meta property="og:title" content="OQIRA — Online Shopping in Pakistan" />
  <meta property="og:description"
    content="Premium cosmetics, jewellery, apparel and baby essentials. Free delivery and cash on delivery across Pakistan." />
  <meta property="og:image" content="https://okira.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OQIRA — premium online store in Pakistan" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OQIRA — Online Shopping in Pakistan" />
  <meta name="twitter:description"
    content="Premium cosmetics, jewellery, apparel and baby essentials. Cash on delivery across Pakistan." />
  <meta name="twitter:image" content="https://okira.vercel.app/og-image.png" />

  <!-- Organization + WebSite structured data (static so crawlers see it without JS) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "OnlineStore",
        "@id": "https://okira.vercel.app/#organization",
        "name": "OQIRA",
        "url": "https://okira.vercel.app/",
        "logo": "https://okira.vercel.app/icon-512.png",
        "image": "https://okira.vercel.app/og-image.png",
        "description": "Pakistan's premium online store for cosmetics, skin care, jewellery, apparel and baby essentials.",
        "founder": [
          { "@type": "Person", "name": "Daud Ansari" },
          { "@type": "Person", "name": "Ahmad Rajpoot" }
        ],
        "areaServed": { "@type": "Country", "name": "Pakistan" },
        "address": { "@type": "PostalAddress", "addressCountry": "PK" },
        "paymentAccepted": ["Cash", "Bank Transfer"],
        "currenciesAccepted": "PKR",
        "contactPoint": [
          { "@type": "ContactPoint", "telephone": "+923247508462", "contactType": "customer service", "areaServed": "PK", "availableLanguage": ["English", "Urdu"] },
          { "@type": "ContactPoint", "telephone": "+923021735137", "contactType": "sales", "areaServed": "PK", "availableLanguage": ["English", "Urdu"] }
        ],
        "sameAs": ["https://wa.me/923247508462"]
      },
      {
        "@type": "WebSite",
        "@id": "https://okira.vercel.app/#website",
        "url": "https://okira.vercel.app/",
        "name": "OQIRA",
        "publisher": { "@id": "https://okira.vercel.app/#organization" },
        "inLanguage": "en-PK",
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://okira.vercel.app/products?search={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <!-- Performance: connect early to the API, image CDN and font hosts -->
  <link rel="preconnect" href="https://okira-backend.vercel.app" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" />

  <style>
    /* Paint the brand colours before the JS bundle arrives (no white flash). */
    html, body { background: #fdf8f5; margin: 0; }
    #root:empty::before {
      content: ""; display: block; height: 36px; background: #0d0a0a;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <noscript>
    <p style="font-family:system-ui,sans-serif;padding:2rem;text-align:center;color:#0d0a0a">
      OQIRA needs JavaScript to run. Please enable it, or order on WhatsApp:
      <a href="https://wa.me/923247508462">+92 324 7508462</a>.
    </p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
